name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test
        env:
          TZ: Europe/Berlin

      - name: TypeScript build
        run: npm run build

      # Compiles and signs the Swift CLI. It cannot be run in CI: there is no
      # calendar and no TCC permission available there.
      - name: Build Swift helper
        run: npm run build:helper

      # A package that installs cleanly but contains no binary fails only at
      # the user's end. The release workflow asserts this too, but by then a
      # tag has been pushed and signing secrets are in play — better to fail a
      # pull request than half a release.
      - name: Verify the package would contain what it must
        run: |
          set -euo pipefail
          PACK_JSON="$(npm pack --json --dry-run)"
          PACK_JSON="$PACK_JSON" node -e '
            const [pack] = JSON.parse(process.env.PACK_JSON);
            const files = new Set(pack.files.map((file) => file.path));
            const required = ["bin/calendar-helper", "dist/index.js", "dist/helperInstall.js"];
            const missing = required.filter((file) => !files.has(file));
            if (missing.length > 0) {
              console.error("Missing package files: " + missing.join(", "));
              process.exit(1);
            }
            console.log(pack.name + "@" + pack.version + ", " + pack.entryCount + " files");
          '

      # The binary ships inside the npm package, so it has to carry both
      # architectures — an arm64-only build breaks on Intel Macs, and only at
      # the user's end.
      #
      # Signature identity is deliberately not checked: CI has no Developer ID
      # certificate, so build.sh signs ad-hoc here. That is the release
      # workflow's job, where a certificate is expected to exist.
      - name: Verify the helper is universal
        run: |
          set -euo pipefail
          lipo -info bin/calendar-helper | tee /tmp/lipo.out
          grep -qE "are: (x86_64 arm64|arm64 x86_64)" /tmp/lipo.out
          codesign --verify --strict --verbose=2 bin/calendar-helper
