name: Release

# Ein Tag v* baut, signiert, notarisiert und veroeffentlicht: npm-Paket, GitHub-Release mit .mcpb,
# calendar-helper.zip und SHA256SUMS, MCP-Registry-Eintrag. Der Job laeuft in der Environment
# "release": erst Martins Freigabe dort gibt die Signing-Secrets frei (ACM-10).
# Die Schritte rufen scripts/release/*.sh, dieselben wie release-candidate.yml.
on:
  push:
    tags: ['v*']

# Zwei Tags kurz hintereinander duerfen sich nicht beim Veroeffentlichen ueberholen. Kein
# cancel-in-progress: ein halb durchgelaufener Release waere schlimmer als ein wartender Lauf.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # GitHub-Release
  id-token: write # npm-Provenance, Attestation, MCP-Registry-Anmeldung
  attestations: write

env:
  APPLE_TEAM_ID: 4KTGF63CD2
  # Erzwingt die Developer ID: Fehlt sie im Schluesselbund, scheitert codesign in swift/build.sh,
  # statt still ad hoc zu signieren. Ad hoc banden die Kalenderberechtigung an den Code-Hash.
  CODESIGN_IDENTITY: 'Developer ID Application: Martin Alker (4KTGF63CD2)'
  # Gepinnt, gleiche Version wie in ci.yml und dem jeweils anderen Release-Workflow.
  MCPB_VERSION: 2.1.2

jobs:
  release:
    # macos-14 wurde am 2026-11-02 abgeschaltet (ACM-11). Das Deployment-Target 14.0 setzt
    # swift/build.sh, unabhaengig vom Runner.
    runs-on: macos-15
    # Erst Martins Freigabe in dieser Environment gibt die Signing-Secrets frei (ACM-10).
    environment: release
    # Grosszuegig ueber Build, Tests und Notarisierung (--timeout 30m).
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # check-tag.sh braucht origin/main
          # Kein Schreib-Token in .git/config fuer die spaeteren Schritte; gh bekommt GH_TOKEN gezielt.
          persist-credentials: false

      # Neueste Nicht-Beta-Version von Xcode 16, wie in apple-mail-mcp.
      - name: Select Xcode
        run: |
          set -euo pipefail
          XCODE="$(/bin/ls -d /Applications/Xcode_16*.app 2>/dev/null | /usr/bin/grep -vi beta | /usr/bin/sort -V | /usr/bin/tail -n 1 || true)"
          if [ -z "$XCODE" ]; then
            echo "::error::No non-beta Xcode 16 found under /Applications."
            exit 1
          fi
          /usr/bin/sudo /usr/bin/xcode-select -s "$XCODE"
          swift --version

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      - name: Check tag
        run: scripts/release/check-tag.sh "$GITHUB_REF_NAME"

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test
        env:
          TZ: Europe/Berlin

      - name: TypeScript build
        run: npm run build

      # Vor Build und Notarisierung, damit ein fehlendes Secret nicht erst nach Minuten auffaellt.
      - name: Check secrets
        run: scripts/release/require-env.sh APPLE_CERTIFICATE_BASE64 APPLE_CERTIFICATE_PASSWORD APPLE_API_KEY_BASE64 APPLE_API_KEY_ID APPLE_API_ISSUER_ID
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}

      - name: Import signing certificate
        run: scripts/release/import-signing.sh
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Build helper (Developer ID)
        run: npm run build:helper

      # Gleich nach dem Signieren: danach laeuft Fremdcode (npm, Attestation, mcp-publisher), der die
      # Developer-ID-Identitaet nicht mehr erreichen soll. Notarisieren braucht den Schluesselbund nicht.
      - name: Remove keychain after signing
        run: scripts/release/cleanup-keychain.sh

      - name: Notarize
        run: scripts/release/notarize.sh bin/calendar-helper "$RUNNER_TEMP/calendar-helper.zip"
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}

      - name: Verify helper
        id: helper
        run: |
          set -euo pipefail
          CDHASH="$(scripts/release/verify-helper.sh bin/calendar-helper)"
          echo "cdhash=$CDHASH" >>"$GITHUB_OUTPUT"

      - name: Verify npm package
        id: npm
        run: |
          set -euo pipefail
          TARBALL="$(scripts/release/verify-npm-pack.sh "${{ steps.helper.outputs.cdhash }}")"
          echo "tarball=$TARBALL" >>"$GITHUB_OUTPUT"

      - name: Build and verify MCPB
        id: mcpb
        run: |
          set -euo pipefail
          MCPB="$(scripts/release/build-mcpb.sh "${{ steps.helper.outputs.cdhash }}")"
          echo "path=$MCPB" >>"$GITHUB_OUTPUT"

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            ${{ runner.temp }}/calendar-helper.zip
            ${{ steps.mcpb.outputs.path }}

      # Ohne Token: npm erkennt die OIDC-Umgebung von GitHub Actions selbst (Trusted Publisher auf
      # npmjs.com, dieses Repository, diese Workflow-Datei, id-token: write oben).
      - name: Publish to npm and GitHub
        run: scripts/release/publish.sh "${{ steps.npm.outputs.tarball }}" "${{ steps.mcpb.outputs.path }}" "$RUNNER_TEMP/calendar-helper.zip"
        env:
          GH_TOKEN: ${{ github.token }}

      # Zuletzt: scheitert die Registry, sind npm und Release trotzdem draussen; registry.yml holt nach.
      # Ohne Pfad: Die Pruefsumme kommt vom veroeffentlichten Asset. Ein Re-Run baut die .mcpb neu,
      # und deren Bytes unterscheiden sich von der, die im Release liegt.
      - name: Publish to the MCP Registry
        run: bash scripts/publish-registry.sh
        env:
          GH_TOKEN: ${{ github.token }}

      # Rueckfall, falls ein Schritt davor gescheitert ist.
      - name: Remove keychain
        if: always()
        run: scripts/release/cleanup-keychain.sh
